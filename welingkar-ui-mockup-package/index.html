function spend(){let scope=selectedUnit==='all'?units:units.filter(u=>u.name===selectedUnit),gross=scope.reduce((s,u)=>s+u.gross,0);return head('Spend analysis','Understand the mix, trajectory, and original account classifications.')+filterBar(true)+`<div class="kpis">${kpi('Recorded gross',crore(gross),'Exported purchase detail','money','primary-kpi')}${kpi('Basic amount',selectedUnit==='all'?'₹25.46 Cr':crore(gross-scope[0].gst),'Before recorded GST','stack')}${kpi('Explicit capital-work heads','₹5.87 Cr','All units · Source classification','building')}${kpi('Account heads','90','All units · Original labels retained','column')}</div><div class="grid grid-two">${card('Monthly gross by unit','₹ lakh · Posting month',`<div class="chart-body">${selectedUnit==='all'?groupedChart():monthlyChart(scope[0].monthly)}</div>`,'',`<div style="display:flex;gap:15px">${units.map(u=>`<span style="display:flex;gap:5px;align-items:center"><i style="width:6px;height:6px;border-radius:2px;background:${u.color}"></i>${u.name}</span>`).join('')}</div>`)}${card('Goods & services','As classified in the original registers · All units',donut()+`<div class="attention" style="padding-bottom:16px"><div class="attention-item"><div><strong>₹5.87 Cr in explicit capital-work heads</strong><p>A classification view; not a complete capex definition.</p></div>${ico('building')}</div></div>`)}</div>${table('Category analysis','All units · Original account labels have not been merged.',['Account head','Vouchers','Recorded gross','Share'],categories.map(r=>[r[0],r[1],r[2],`<span class="mini-bar">${r[3]}<span class="mini-track"><i style="width:${parseFloat(r[3])/15.3*100}%"></i></span></span>`]),{search:true,placeholder:'Search account heads...',numeric:true,pagination:true,total:90,download:true})}`}
const parties=[['NU Associates LLP','Bengaluru','15','₹3.28 Cr','11.7%'],['JARO Institute of Technology Mgmt. & Res. Ltd (Crs)','Autonomous','6','₹1.62 Cr','5.8%'],['Artimiza Designers','3 units','13','₹1.58 Cr','5.7%'],['DMC Finishing School Pvt Ltd','Autonomous','6','₹1.51 Cr','5.4%'],['BEST Undertaking','PGDM','119','₹1.13 Cr','4.0%'],['Yangpoo Marketing Pvt Ltd','Autonomous','8','₹1.07 Cr','3.8%']];
function counterparties(){return head('Counterparties','Explore recorded party names, concentration, and identity review candidates.')+filterBar()+`<div class="kpis">${kpi('Recorded party names','460','Recorded names · Not deduplicated','users','primary-kpi')}${kpi('Top ten share','48.5%','Share of recorded gross','chart')}${kpi('Names in multiple units','52','Cross-unit recorded names','building')}${kpi('Same-identifier name groups','9','Review identity before merging','alert','alert-kpi')}</div><div class="grid grid-third">${card('Counterparty concentration','Share of recorded gross',`<div style="padding:26px 21px 22px"><div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:11px"><span style="color:#486655">Top 10 recorded names</span><strong style="font-weight:500">48.5%</strong></div><div style="height:24px;display:flex;border-radius:5px;overflow:hidden"><div style="width:48.5%;background:#0b897a"></div><div style="width:51.5%;background:#dce7ed"></div></div><div style="display:flex;justify-content:space-between;margin-top:12px;font-size:10px;color:#91a0ab"><span>10 recorded names</span><span>Remaining names · 51.5%</span></div><p class="text-note" style="margin-top:20px">Concentration uses original party labels. Related names have not been consolidated.</p></div>`)}${card('Identity review','Candidates requiring original evidence',`<div class="attention"><div class="attention-item"><div><strong>Same-identifier name groups</strong><p>Confirm relationships before merging.</p></div><span class="attention-num">9</span></div><div class="attention-item"><div><strong>Repeated bill-reference groups</strong><p>Review candidates; no proven duplicates.</p></div><span class="attention-num">5</span></div></div>`)}</div>${table('Counterparty portfolio','Recorded names preserved; cross-unit labels shown for context.',['Recorded party name','Units','Vouchers','Recorded gross','Gross share'],parties.map((r,i)=>[`<span style="display:flex;gap:10px;align-items:center"><span class="unit-badge ${i%2?'blue':''}">${r[0].slice(0,2).toUpperCase()}</span><span style="max-width:330px;overflow:hidden;text-overflow:ellipsis">${r[0]}</span></span>`,badge(r[1],'blue'),r[2],r[3],r[4]]),{search:true,placeholder:'Search party names...',download:true,pagination:true,total:460})}`}
function tax(){return head('Tax & TDS','Recorded tax values, withholding, and component review.')+filterBar()+`<div class="kpis">${kpi('Recorded GST','₹2.54 Cr','Source Total GST values','tax','primary-kpi')}${kpi('Recorded TDS withheld','₹1.26 Cr','Recorded withholding magnitude','money')}${kpi('GST-bearing rows','1,485','Detail rows with recorded GST','table')}${kpi('Component mismatches','1','GST components vs recorded total','alert','alert-kpi')}</div><div class="inline-note">${ico('info')}<span>Recorded-value analysis only. Input-credit eligibility, legal rates, and remittance require original evidence. “Tax Type” remains an unconfirmed ERP classification.</span></div><div class="grid grid-equal">${card('Recorded GST by unit','₹ lakh · Aggregated from the source registers',`<div class="unit-list">${units.map(u=>`<div class="unit-line"><div class="label"><span style="color:#526d7c">${u.name}</span><span>${lakh(u.gst)}</span></div><div class="bar-bg"><div class="bar-fill" style="width:${u.gst/10000000*100}%;background:${u.color}"></div></div></div>`).join('')}</div>`,'',`<span>Recorded Total GST</span><span>₹2.54 Cr</span>`)}${card('Tax review priorities','Separate recorded arithmetic from tax interpretation',`<div class="attention"><div class="attention-item"><div><strong>Tax-component reconciliation</strong><p>One component inconsistency in the supplied detail.</p></div>${badge('1 review')}</div><div class="attention-item"><div><strong>ERP tax classifications</strong><p>“Exempted” can coexist with supplier GST.</p></div>${badge('Context','blue')}</div><div class="attention-item"><div><strong>Source evidence</strong><p>Returns and payment evidence are not supplied.</p></div>${ico('file')}</div></div>`)}</div>${table('Recorded tax values by unit','Values as entered in the original registers.',['Unit','Recorded gross','Recorded GST','GST / gross¹'],units.map(u=>[unitLabel(u),crore(u.gross),lakh(u.gst),(u.gst/u.gross*100).toFixed(2)+'%']),{numeric:true,download:true,note:'¹ Recorded GST divided by recorded gross; this ratio is not a statutory tax rate.'})}`}
const queue=[['BBI/26-27/JUN/0120','NU Associates LLP','Bengaluru','₹20.33 L'],['BBI/26-27/SEP/0017','Trig Security Services','Bengaluru','₹5.47 L'],['BBI/26-27/MAY/0079','Trig Security Services','Bengaluru','₹4.66 L'],['BBI/26-27/JUL/0014','Microline India Pvt. Ltd.','Bengaluru','₹2.21 L'],['ABI/26-27/MAY/0012','Rio Corporation','Autonomous','−₹2.01 L'],['ABI/26-27/SEP/0025','Rio Corporation','Autonomous','−₹1.90 L']];
function reconciliation(){return head('Reconciliation','Prioritise voucher differences and inspect the source values.')+filterBar()+`<div class="kpis">${kpi('Net exceptions','212','Vouchers with a net difference','alert','alert-kpi')}${kpi('Monetary vouchers affected','9.1%','Excludes vouchers without amounts','chart')}${kpi('Absolute differences','₹56.42 L','Sum of absolute voucher differences','money')}${kpi('Unvalued vouchers','8','Whole vouchers without amounts','file')}</div><div class="grid grid-two">${card('Exceptions by unit','Number of vouchers requiring net reconciliation',`<div class="unit-list">${[units[1],units[0],units[2],units[3]].map(u=>`<div class="unit-line"><div class="label"><span style="color:#546d7b">${u.name}</span><span>${u.exceptions} vouchers</span></div><div class="bar-bg"><div class="bar-fill" style="width:${u.exceptions/212*100}%;background:${u.name==='Bengaluru'?'#be9252':'#d8c6a9'}"></div></div></div>`).join('')}</div>`,'',`<span>Bengaluru accounts for 163 of 212 net exceptions.</span>`)}${card('Reconciliation basis','A review check, not a payment determination',`<div style="padding:22px 20px 19px"><div style="padding:13px 14px;border:1px solid #e8edf0;background:#fafcfc;border-radius:7px;font-size:12px;color:#617a89">Entered net − (gross + signed TDS)</div><p class="text-note" style="margin-top:14px;line-height:1.8">Original signs and source values are retained. Differences are review candidates, not financial loss or confirmed incorrect payments.</p></div>`,'',`<span>Arithmetic tolerance</span><strong>₹1</strong>`)}</div>${table('Voucher review queue','Ordered by absolute difference · Original recorded values.',['Voucher / internal reference','Recorded party','Unit','Net difference','Status',''],queue.map(r=>[`<span style="font-size:10px;letter-spacing:.1px">${r[0]}</span>`,r[1],badge(r[2],'blue'),`<span style="color:#9e6e2d;font-weight:550">${r[3]}</span>`,badge('Review net'),`<button class="btn ghost" onclick="openVoucher('${r[0]}')">Inspect ${ico('arrow')}</button>`]),{search:true,placeholder:'Search voucher or party...',download:true,pagination:true,total:212,tabs:`<div class="toolbar-tabs"><button class="active" onclick="showQueue('Net exceptions',this)">Net exceptions <span style="margin-left:4px;color:#b59464">212</span></button><button onclick="showQueue('Unvalued vouchers',this)">Unvalued vouchers <span style="margin-left:4px">8</span></button></div>`})}`}
function quality(){return head('Data quality','Traceable findings, clear record grains, and focused review.')+filterBar()+`<div class="kpis">${kpi('Unvalued vouchers','8','Entire voucher has no amounts','file','alert-kpi')}${kpi('Missing / placeholder HSN','1,050','Detail rows · HSN / SAC','tax')}${kpi('Department blank','2,632','Detail rows · All source records','building')}${kpi('Bill year before 2020','2','Detail rows requiring date review','calendar')}</div><div class="inline-note">${ico('info')}<span>Findings overlap and use different record grains. Counts must not be added to estimate defective transactions or financial loss.</span></div><div class="grid grid-two">${card('Field completeness','Missing or placeholder values · 2,632 detail rows',`<div class="quality-list">${[['Department',2632,'#c19c62'],['HSN / SAC',1050,'#92b5a5']].map(([l,n,c])=>`<div class="quality-line"><span>${l}</span><div class="bar-bg"><div class="bar-fill" style="width:${n/2632*100}%;background:${c}"></div></div><strong>${(n/2632*100).toFixed(1)}%</strong></div>`).join('')}<div class="quality-line"><span>Party name</span><div class="bar-bg"></div><strong>0.0%</strong></div><div class="quality-line"><span>Account head</span><div class="bar-bg"></div><strong>0.0%</strong></div></div>`,'',`<span>Required fields are reviewed at their original grain.</span>`)}${card('Source integrity','What the exported detail supports',`<div class="attention"><div class="attention-item"><div><strong>Core fields populated</strong><p>Unit, voucher, posting date, party, and accounts.</p></div>${badge('Present','green')}</div><div class="attention-item"><div><strong>Basic-to-gross arithmetic</strong><p>Reconciles for all 2,617 monetary rows.</p></div>${badge('Reconciles','green')}</div><div class="attention-item"><div><strong>Completeness of source exports</strong><p>Full period coverage cannot be established.</p></div>${badge('Unconfirmed')}</div></div>`)}</div>${table('Data-quality findings','Screening results require the original evidence before correction.',['Finding','Record grain','Affected count','Review approach',''],[['Department is blank',badge('Detail row','blue'),'2,632','Complete source classification',rowArrow('Department')],['HSN / SAC blank or placeholder',badge('Detail row','blue'),'1,050','Verify original tax evidence',rowArrow('HSN / SAC')],['Whole voucher has no amounts',badge('Voucher','blue'),'8','Retrieve missing values',rowArrow('Unvalued vouchers')],['Bill year is earlier than 2020',badge('Detail row','blue'),'2','Check original bill dates',rowArrow('Bill dates')]],{search:true,placeholder:'Search findings...',pagination:true,total:16})}`}
function transactions(){return head('Transactions','Inspect original detail rows and the internal vouchers behind them.')+filterBar(true)+`<div class="kpis">${kpi('Original detail rows','2,632','Grain: one source Excel detail row','table','primary-kpi')}${kpi('Distinct internal vouchers','2,339','Grain: unit + internal voucher','stack')}${kpi('Rows without amounts','15','Retained with unknown value','alert','alert-kpi')}${kpi('Source registers','4','Original workbooks preserved','file')}</div><div class="inline-note">${ico('info')}<span>Detail rows and vouchers are different grains. This design preview shows selected voucher references; the original detail register belongs in the production view.</span></div>${table('Transaction explorer','Selected voucher references from the current dashboard.',['Internal voucher','Recorded party','Unit','Net difference','Review status',''],queue.map(r=>[`<span style="font-size:10px">${r[0]}</span>`,r[1],badge(r[2],'blue'),r[3],badge('Review net'),`<button class="btn ghost" onclick="openVoucher('${r[0]}')">View ${ico('arrow')}</button>`]),{search:true,placeholder:'Search party or voucher...',download:true,pagination:true,total:2339,tabs:`<div class="toolbar-tabs"><button class="active" onclick="showDesignNote()">Voucher preview</button><button onclick="showDesignNote()">Original detail rows <span style="margin-left:3px">2,632</span></button><button onclick="showDesignNote()">Row review flag ${ico('chevron')}</button></div>`,note:'Production pattern: pinned reference columns, horizontal scrolling, column selection, and a source-row detail drawer.'})}<div class="grid grid-equal" style="margin-top:20px">${card('Inspect a record','Keep the table context while reviewing',`<div style="padding:17px 20px;color:#8095a2;font-size:11px;line-height:1.8">The proposed detail drawer brings the entered amounts, review calculation, and original workbook reference together in one place. Select <strong style="color:#4a6879;font-weight:500">View</strong> to explore the pattern.</div>`)}${card('Original source context','Preserve the distinction between records and vouchers',`<div style="padding:17px 20px;color:#8095a2;font-size:11px;line-height:1.8">A voucher can contain several source detail rows. Production filters, exports, and row counts must follow the selected record grain.</div>`)}</div>`}
function report(){return head('Full report','A structured reading view of the original purchase-register analysis.','Export concept')+`<div class="report-layout"><aside class="card report-outline"><small>IN THIS REPORT</small>${['Executive summary','Source & coverage','Recorded amounts','Spend classifications','Counterparties','Tax & withholding','Reconciliation','Data quality','Recommended actions','Source notes'].map((t,i)=>`<button class="${i===0?'selected':''}" onclick="reportSection('${t}',this)">${t}</button>`).join('')}</aside><article class="card report-paper"><div class="report-kicker">PURCHASE REGISTER ANALYSIS · APR – SEP 2026</div><h2>Recorded purchases.<br>A clearer path to review.</h2><p>Four purchase registers record <strong style="color:#3d5e6c;font-weight:550">₹28.00 Cr</strong> in gross detail across 2,339 internal vouchers. These are exported accounting values and do not establish complete bills, cash paid, or outstanding payables.</p><div class="report-metrics"><div><strong>₹28.00 Cr</strong><small>Recorded gross</small></div><div><strong>2,339</strong><small>Internal vouchers</small></div><div><strong style="color:#ac792e">212</strong><small>Net exceptions</small></div></div><h3>Where management attention is needed</h3><div class="report-priority"><span class="number">01</span><div><strong>Reconcile net amounts before payment reporting</strong><p>212 vouchers have net differences; eight further vouchers have unknown value. The sum of absolute differences is ₹56.42 lakh, not an estimate of loss.</p></div></div><div class="report-priority"><span class="number">02</span><div><strong>Preserve original counterparty identities</strong><p>460 recorded names include nine same-identifier name groups. Confirm the relationships before combining records.</p></div></div><div class="report-priority"><span class="number">03</span><div><strong>Complete the missing classification fields</strong><p>Department is blank across all 2,632 detail rows. HSN / SAC is blank or a placeholder in 1,050 rows.</p></div></div><div class="report-priority"><span class="number">04</span><div><strong>Retain the boundaries of the source evidence</strong><p>The exports support recorded-value analysis. Budget, orders, receipts, payments, and tax returns require additional evidence.</p></div></div><div class="summary-strip" style="margin-top:24px;margin-bottom:0">${ico('alert')}<span>Review original evidence before changing dates, party identities, signs, or source amounts.</span></div><div class="report-rule">Executive summary · UI concept using the current dashboard snapshot</div></article></div>`}
const renderers={overview,spend,counterparties,tax,reconciliation,quality,transactions,report};
const names={overview:'Overview',spend:'Spend analysis',counterparties:'Counterparties',tax:'Tax & TDS',reconciliation:'Reconciliation',quality:'Data quality',transactions:'Transactions',report:'Full report'};
function render(){document.getElementById('content').innerHTML=renderers[activePage]()+footer();document.getElementById('breadcrumb').textContent=names[activePage];document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===activePage));document.title=names[activePage]+' · Welingkar UI concept';hydrateIcons()}
function navigate(){let name=location.hash.slice(1);activePage=renderers[name]?name:'overview';document.getElementById('sidebar').classList.remove('mobile-open');render();window.scrollTo(0,0)}
window.addEventListener('hashchange',navigate);document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('mobile-open');
let previousFocus=null;function openDrawer(html){previousFocus=document.activeElement;document.getElementById('drawerContent').innerHTML=html;document.getElementById('drawerBackdrop').classList.add('open');document.querySelector('.drawer .close').focus();document.body.style.overflow='hidden'}
function closeDrawer(){document.getElementById('drawerBackdrop').classList.remove('open');document.body.style.overflow='';if(previousFocus)previousFocus.focus()}
document.getElementById('drawerBackdrop').addEventListener('click',e=>{if(e.target.id==='drawerBackdrop')closeDrawer()});document.addEventListener('keydown',e=>{const b=document.getElementById('drawerBackdrop');if(e.key==='Escape')closeDrawer();if(e.key==='Tab'&&b.classList.contains('open')){const f=[...b.querySelectorAll('button,a,input,select')].filter(x=>x.offsetParent!==null);if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}});
function openUnit(name){let u=units.find(x=>x.name===name);if(!u){showDesignNote();return}openDrawer(`<span class="design-tag">Unit detail · Concept</span><h2 id="drawerTitle">${u.name}</h2><p>Recorded values from the April – September 2026 dashboard snapshot.</p>${[['Internal vouchers',comma(u.vouchers)],['Recorded gross',crore(u.gross)],['Recorded GST',lakh(u.gst)],['Net exceptions',u.exceptions],['Unvalued vouchers',u.unknown]].map(([k,v])=>`<div class="drawer-detail"><span>${k}</span><strong>${v}</strong></div>`).join('')}<div class="modal-bottom">Production pattern: retain this summary and provide direct access to original source rows. No source record is changed in this preview.</div>`)}
function openVoucher(ref){let q=queue.find(q=>q[0]===ref);openDrawer(`<span class="design-tag">Voucher inspection · Concept</span><h2 id="drawerTitle">Review net difference</h2><p>${ref}<br>${q[1]}</p><div class="drawer-detail"><span>Organisational unit</span><strong>${q[2]}</strong></div><div class="drawer-detail"><span>Net difference</span><strong style="color:#ae7c36">${q[3]}</strong></div><div class="drawer-detail"><span>Review status</span>${badge('Review net')}</div><h3 style="font-size:13px;margin-top:28px">Calculation pattern</h3><p>Entered net − (recorded gross + signed TDS)</p><div class="modal-bottom"><strong>Proposed source panel</strong><br>Original amounts, workbook, sheet, Excel row, and all rows belonging to the voucher would appear here when connected to the source data.</div><p style="font-size:10px">A net difference is a review candidate. It does not establish an incorrect payment or financial loss.</p>`)}
function openAbout(){openDrawer(`<span class="design-tag">Design direction · v1</span><h2 id="drawerTitle">Welingkar purchase analysis</h2><p>A visual redesign of all eight sections of the existing dashboard. The mockup uses values visible in the dashboard on 28 October 2026.</p>${[['Navigation','Persistent sidebar'],['Visual style','Navy · Teal · Light canvas'],['Data scope','Apr – Sep 2026 snapshot'],['Live connection','Not connected']].map(([k,v])=>`<div class="drawer-detail"><span>${k}</span><strong>${v}</strong></div>`).join('')}<div class="modal-bottom">Explore all eight screens using the sidebar. The overview unit filter, record search, and inspection drawers demonstrate the proposed interaction patterns. Other filters are layout concepts.</div><p style="font-size:10px">The original dashboard, records, classifications, and source workbooks have not been edited.</p>`)}
function showPeriod(){openDrawer(`<span class="design-tag">Period selector · Concept</span><h2 id="drawerTitle">Reporting period</h2><p>The available source snapshot covers April – September 2026.</p><div class="drawer-detail"><span>From</span><strong>01 Apr 2026</strong></div><div class="drawer-detail"><span>Through</span><strong>30 Sep 2026</strong></div><div class="modal-bottom">The date-control layout is part of the mockup. New periods and live date filtering require the production data connection.</div>`)}
function showDesignNote(){notify('Design control preview · Requires the production data connection')}
function notify(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function filterRows(input){let table=input.closest('.card').querySelector('table');let found=0;table.querySelectorAll('tbody tr').forEach(row=>{let match=row.textContent.toLowerCase().includes(input.value.toLowerCase());row.classList.toggle('hidden',!match);if(match)found++});let status=input.closest('.card').querySelector('.pagination>span');if(status)status.textContent=found+' matching preview records'}
function showQueue(label,button){if(label==='Unvalued vouchers'){openDrawer(`<span class="design-tag">Queue pattern · Concept</span><h2 id="drawerTitle">8 unvalued vouchers</h2><p>These eight PGDM vouchers have no amounts at the whole-voucher level.</p><div class="modal-bottom">The production queue should display their original references and link each to the workbook evidence. Individual references are not included in this design preview.</div>`)}else notify('Net exception queue · 212 vouchers in the source snapshot')}
function reportSection(label,button){if(label==='Executive summary'){document.querySelectorAll('.report-outline button').forEach(b=>b.classList.toggle('selected',b===button));return}const links={'Recorded amounts':'overview','Spend classifications':'spend','Counterparties':'counterparties','Tax & withholding':'tax','Reconciliation':'reconciliation','Data quality':'quality'};if(links[label])location.hash=links[label];else openDrawer(`<span class="design-tag">Report navigation · Concept</span><h2 id="drawerTitle">${label}</h2><p>The full report reading view would retain the original analysis, exact recorded values, limitations, and source references in this section.</p><div class="modal-bottom">This mockup demonstrates the executive-summary layout and report navigation pattern. The original report is available in your existing dashboard.</div>`)}
function exportConcept(){const rows=[['Screen',names[activePage]],['Type','UI concept - fixed source snapshot'],['Source period','April - September 2026'],['Recorded gross INR',grossTotal],['Internal vouchers',2339],['Net exceptions',212],['Note','Concept summary only; not a source-register export']];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='welingkar-'+activePage+'-concept-summary.csv';a.click();URL.revokeObjectURL(a.href);notify('Concept summary exported · Source register not included')}
navigate();
</script>
